<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>VESC RT DATA Dash</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  body {
    background: #090b0e;
    color: #cbd5e1;
    font-family: 'Inter', sans-serif;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    overflow-x: hidden;
  }
  .mono { font-family: 'JetBrains Mono', monospace; }

  /* Exakter VESC Rundinstrument-Look */
  .vesc-dial {
    background: radial-gradient(circle at center, #181d26 0%, #0e1218 100%);
    border: 2px solid #232d3b;
    border-radius: 50%;
    position: relative;
    box-shadow: inset 0 0 12px rgba(0,0,0,0.9), 0 4px 10px rgba(0,0,0,0.6);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  .dial-ticks {
    position: absolute;
    inset: 3px;
    border-radius: 50%;
    border: 1px dashed #2c3848;
    opacity: 0.5;
  }
  .needle {
    position: absolute;
    width: 2px;
    height: 40%;
    background: linear-gradient(to top, transparent 15%, #38bdf8 100%);
    bottom: 50%;
    left: calc(50% - 1px);
    transform-origin: bottom center;
    transform: rotate(-130deg);
    transition: transform 0.1s ease-out;
  }
</style>
</head>
<body class="h-screen flex flex-col justify-between max-w-md mx-auto select-none p-2">

  <!-- TOP TABS (START | RT DATA | PROFILES) -->
  <header class="flex flex-col bg-[#11161d] border-b border-[#1e2733] pt-1">
    <div class="grid grid-cols-3 text-center text-xs font-semibold py-2 text-slate-400">
      <button class="hover:text-white">START</button>
      <button class="text-sky-400 border-b-2 border-sky-400 pb-1">RT DATA</button>
      <button class="hover:text-white">PROFILES</button>
    </div>
  </header>

  <!-- DASHBOARD HAUPTEBENE (Exaktes RT DATA Layout) -->
  <main class="flex-1 flex flex-col justify-around py-1 relative">
    
    <!-- REIHE 1: CURRENT | POWER | DUTY -->
    <div class="grid grid-cols-3 gap-1 px-1 items-center">
      <div class="vesc-dial w-28 h-28 mx-auto">
        <div class="dial-ticks"></div>
        <span class="text-[8px] font-bold text-slate-400 tracking-wider">CURRENT</span>
        <span id="val-current" class="text-base font-bold mono text-white my-0.5">0</span>
        <span class="text-[8px] text-slate-500">A</span>
      </div>

      <div class="vesc-dial w-32 h-32 mx-auto border-sky-500/30">
        <div class="dial-ticks"></div>
        <span class="text-[9px] font-bold text-sky-400 tracking-wider">POWER</span>
        <span id="val-power" class="text-lg font-extrabold mono text-white my-0.5">0</span>
        <span class="text-[8px] text-slate-500">W</span>
      </div>

      <div class="vesc-dial w-28 h-28 mx-auto">
        <div class="dial-ticks"></div>
        <span class="text-[8px] font-bold text-slate-400 tracking-wider">DUTY</span>
        <span id="val-duty" class="text-base font-bold mono text-white my-0.5">0</span>
        <span class="text-[8px] text-slate-500">%</span>
      </div>
    </div>

    <!-- REIHE 2: SPEED (Gross links) & BATTERY (Rechts überlappend) -->
    <div class="relative flex justify-center items-center my-1">
      <!-- Großes Speed-Dial -->
      <div class="vesc-dial w-52 h-52 border-2 border-sky-400/50 shadow-[0_0_20px_rgba(56,189,248,0.1)]">
        <div class="dial-ticks"></div>
        <span class="text-[10px] font-bold text-slate-400 tracking-widest mt-2">SPEED</span>
        <span id="val-speed" class="text-5xl font-black mono text-white my-0.5">0</span>
        <span class="text-xs font-bold text-sky-400 mb-1">KM/H</span>
        <div class="absolute bottom-3 left-4 text-xs text-slate-500">⚙️</div>
      </div>

      <!-- Batterie-Dial (rechts versetzt) -->
      <div class="vesc-dial w-36 h-36 absolute right-2 shadow-xl z-10 bg-[#121720]">
        <div class="dial-ticks"></div>
        <span class="text-[9px] font-bold text-slate-400 tracking-wider">BATTERY</span>
        <span id="val-bat" class="text-xl font-extrabold mono text-emerald-400 my-0.5">0%</span>
        <span id="val-range" class="text-[8px] text-slate-400">0 KM RANGE</span>
      </div>
    </div>

    <!-- REIHE 3: TEMP ESC | CONSUMP. | TEMP MOTOR -->
    <div class="grid grid-cols-3 gap-1 px-1 items-center">
      <div class="vesc-dial w-28 h-28 mx-auto">
        <div class="dial-ticks"></div>
        <span class="text-[8px] font-bold text-slate-400 tracking-wider">TEMP ESC</span>
        <span id="val-tesc" class="text-sm font-bold mono text-white my-0.5">0</span>
        <span class="text-[8px] text-slate-500">°C</span>
      </div>

      <div class="vesc-dial w-32 h-32 mx-auto">
        <div class="dial-ticks"></div>
        <span class="text-[8px] font-bold text-slate-400 tracking-wider">CONSUMP.</span>
        <span id="val-cons" class="text-sm font-bold mono text-white my-0.5">0.0</span>
        <span class="text-[8px] text-slate-500">WH/KM</span>
        <span id="val-cons-avg" class="text-[7px] text-slate-400">0 AVG</span>
      </div>

      <div class="vesc-dial w-28 h-28 mx-auto">
        <div class="dial-ticks"></div>
        <span class="text-[8px] font-bold text-slate-400 tracking-wider">TEMP MOTOR</span>
        <span id="val-tmot" class="text-sm font-bold mono text-white my-0.5">0</span>
        <span class="text-[8px] text-slate-500">°C</span>
      </div>
    </div>

  </main>

  <!-- ODOMETER & TRIP LEISTE -->
  <footer class="bg-[#11161d] border-t border-b border-[#1e2733] py-2 px-3 grid grid-cols-3 text-center text-xs">
    <div>
      <div class="text-[8px] font-bold text-slate-500 uppercase">ODOMETER</div>
      <div id="val-odo" class="font-mono font-bold text-slate-300">0.0</div>
    </div>
    <div>
      <div class="text-[8px] font-bold text-slate-500 uppercase">TRIP</div>
      <div id="val-trip" class="font-mono font-bold text-sky-400">0.0</div>
    </div>
    <div>
      <div class="text-[8px] font-bold text-slate-500 uppercase">UP-TIME</div>
      <div id="val-uptime" class="font-mono font-bold text-slate-300">00:00:00</div>
    </div>
  </footer>

  <!-- UNTERE STEUERLEISTE (Settings & Status) -->
  <nav class="flex justify-between items-center px-4 py-2 bg-[#0e1218]">
    <button class="text-slate-400 text-lg">⚙️</button>
    <div class="flex items-center gap-2">
      <button id="btn-demo" class="text-[10px] px-2 py-1 bg-slate-800 rounded text-slate-300 font-medium">DEMO</button>
      <button id="btn-connect" class="text-[10px] px-3 py-1 bg-sky-500 text-slate-950 font-bold rounded">CONNECT G3</button>
    </div>
    <span class="text-[10px] font-bold text-slate-400 tracking-wider">CAN</span>
  </nav>

<script>
  let bluetoothDevice, gattServer, rxCharacteristic, txCharacteristic;
  let isConnected = false;
  let demoInterval = null;
  let startTime = Date.now();

  const elSpeed = document.getElementById('val-speed');
  const elPower = document.getElementById('val-power');
  const elCurrent = document.getElementById('val-current');
  const elDuty = document.getElementById('val-duty');
  const elBat = document.getElementById('val-bat');
  const elRange = document.getElementById('val-range');
  const elTEsc = document.getElementById('val-tesc');
  const elTMot = document.getElementById('val-tmot');
  const elCons = document.getElementById('val-cons');
  const elTrip = document.getElementById('val-trip');
  const elOdo = document.getElementById('val-odo');
  const elUptime = document.getElementById('val-uptime');
  const btnConnect = document.getElementById('btn-connect');

  // Uptime Zähler
  setInterval(() => {
    if(!isConnected && !demoInterval) return;
    let sec = Math.floor((Date.now() - startTime) / 1000);
    let hrs = Math.floor(sec / 3600).toString().padStart(2, '0');
    let min = Math.floor((sec % 3600) / 60).toString().padStart(2, '0');
    let s = (sec % 60).toString().padStart(2, '0');
    elUptime.textContent = `${hrs}:${min}:${s}`;
  }, 1000);

  function updateDashboard(data) {
    elSpeed.textContent = Math.round(data.speed);
    elPower.textContent = Math.round(data.power);
    elCurrent.textContent = (data.current).toFixed(1);
    elDuty.textContent = Math.round(data.duty);
    elBat.textContent = Math.round(data.battery) + '%';
    elRange.textContent = Math.round(data.battery * 0.35) + ' KM RANGE';
    elTEsc.textContent = Math.round(data.tempEsc);
    elTMot.textContent = Math.round(data.tempMotor);
    elCons.textContent = data.cons.toFixed(1);
    elTrip.textContent = data.trip.toFixed(1);
    if(data.odo) elOdo.textContent = data.odo.toFixed(1);
  }

  // Demo Modus Simulation
  document.getElementById('btn-demo').onclick = () => {
    if (demoInterval) {
      clearInterval(demoInterval);
      demoInterval = null;
      btnConnect.textContent = "CONNECT G3";
      updateDashboard({speed:0, power:0, current:0, duty:0, battery:0, tempEsc:0, tempMotor:0, cons:0, trip:0, odo:0});
      return;
    }
    
    btnConnect.textContent = "DEMO RUN";
    let t = 0;
    demoInterval = setInterval(() => {
      t += 0.1;
      let spd = Math.abs(Math.sin(t) * 55);
      let pwr = spd * 20 + Math.random() * 30;
      updateDashboard({
        speed: spd,
        power: pwr,
        current: pwr / 51,
        duty: (spd / 60) * 100,
        battery: 92,
        tempEsc: 35 + (spd * 0.2),
        tempMotor: 39 + (spd * 0.3),
        cons: 14.8,
        trip: (t * 0.04),
        odo: 210.4
      });
    }, 100);
  };

  // Ninebot Bluetooth-Verbindung
  btnConnect.onclick = async () => {
    if (!navigator.bluetooth) {
      alert("Bitte öffne diese Seite in der 'Bluefy' App auf deinem iPhone!");
      return;
    }

    try {
      btnConnect.textContent = "SEARCH...";
      bluetoothDevice = await navigator.bluetooth.requestDevice({
        filters: [{ namePrefix: 'NB' }, { namePrefix: 'Ninebot' }, { namePrefix: 'SEGWAY' }],
        optionalServices: ['6e400001-b5a3-f393-e0a9-e50e24dca9e6']
      });

      btnConnect.textContent = "CONNECT...";
      gattServer = await bluetoothDevice.gatt.connect();
      const service = await gattServer.getPrimaryService('6e400001-b5a3-f393-e0a9-e50e24dca9e6');
      
      txCharacteristic = await service.getCharacteristic('6e400002-b5a3-f393-e0a9-e50e24dca9e6');
      rxCharacteristic = await service.getCharacteristic('6e400003-b5a3-f393-e0a9-e50e24dca9e6');

      await rxCharacteristic.startNotifications();
      rxCharacteristic.addEventListener('characteristicvaluechanged', (e) => {
        const value = e.target.value;
        if (value.byteLength < 14) return;
        let speed = (value.getUint16(4, true)) / 1000;
        let current = (value.getInt16(6, true)) / 100;
        let voltage = (value.getUint16(8, true)) / 100;
        let battery = value.getUint8(10);
        let temp = value.getInt8(11);
        let power = Math.abs(current * voltage);

        updateDashboard({
          speed: speed,
          power: power,
          current: current,
          duty: (speed / 60) * 100,
          battery: battery,
          tempEsc: temp,
          tempMotor: temp + 5,
          cons: speed > 0 ? (power / speed) : 0,
          trip: 0
        });
      });

      isConnected = true;
      btnConnect.textContent = "CONNECTED";
      setInterval(async () => {
        if (!isConnected || !txCharacteristic) return;
        const cmd = new Uint8Array([0x55, 0xAA, 0x03, 0x20, 0x01, 0x25, 0x0E, 0xA9, 0xFF]);
        try { await txCharacteristic.writeValue(cmd); } catch(err) {}
      }, 200);

    } catch (error) {
      console.error(error);
      btnConnect.textContent = "FAILED";
    }
  };
</script>
</body>
</html>
