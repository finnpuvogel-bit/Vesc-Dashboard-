<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Ninebot Max G3 VESC Dash</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  body {
    background: #0d0e12;
    color: #e2e8f0;
    font-family: 'Inter', sans-serif;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }
  .mono { font-family: 'JetBrains Mono', monospace; }
  
  .gauge-card {
    background: radial-gradient(circle at center, #1c222b 0%, #11151c 100%);
    border: 2px solid #2a3442;
    border-radius: 50%;
    position: relative;
    box-shadow: inset 0 0 15px rgba(0,0,0,0.8), 0 4px 12px rgba(0,0,0,0.5);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  .gauge-tick-ring {
    position: absolute;
    inset: 4px;
    border-radius: 50%;
    border: 1px dashed #3a4859;
    opacity: 0.6;
  }
</style>
</head>
<body class="h-screen flex flex-col justify-between p-3 max-w-lg mx-auto select-none">

  <!-- TOP BAR -->
  <header class="flex justify-between items-center bg-[#151a21] px-4 py-2 rounded-xl border border-[#263140]">
    <div class="flex items-center gap-2">
      <div id="status-dot" class="w-3 h-3 rounded-full bg-red-500 shadow-[0_0_8px_#ef4444]"></div>
      <span id="status-text" class="text-xs font-semibold text-slate-300 uppercase tracking-wider">OFFLINE</span>
    </div>
    <div class="flex gap-2">
      <button id="btn-demo" class="text-xs px-3 py-1.5 rounded-lg bg-slate-700 hover:bg-slate-600 font-medium">DEMO</button>
      <button id="btn-connect" class="text-xs px-3 py-1.5 rounded-lg bg-sky-500 hover:bg-sky-400 text-slate-950 font-bold tracking-wide">CONNECT G3</button>
    </div>
  </header>

  <!-- DASHBOARD GRID -->
  <main class="flex-1 my-3 flex flex-col justify-center gap-3">
    
    <!-- TOP ROW (CURRENT | POWER | DUTY) -->
    <div class="grid grid-cols-3 gap-2">
      <div class="gauge-card aspect-square">
        <div class="gauge-tick-ring"></div>
        <span class="text-[9px] font-bold text-slate-400 tracking-wider">CURRENT</span>
        <span id="val-current" class="text-lg font-extrabold mono text-white">0</span>
        <span class="text-[9px] text-slate-500">A</span>
      </div>

      <div class="gauge-card aspect-square border-sky-500/40">
        <div class="gauge-tick-ring"></div>
        <span class="text-[10px] font-bold text-sky-400 tracking-wider">POWER</span>
        <span id="val-power" class="text-xl font-extrabold mono text-white">0</span>
        <span class="text-[9px] text-slate-500">W</span>
      </div>

      <div class="gauge-card aspect-square">
        <div class="gauge-tick-ring"></div>
        <span class="text-[9px] font-bold text-slate-400 tracking-wider">DUTY</span>
        <span id="val-duty" class="text-lg font-extrabold mono text-white">0</span>
        <span class="text-[9px] text-slate-500">%</span>
      </div>
    </div>

    <!-- MIDDLE ROW (SPEED | BATTERY) -->
    <div class="grid grid-cols-5 gap-2 items-center">
      <div class="col-span-3 gauge-card aspect-square border-2 border-sky-400/60 shadow-[0_0_20px_rgba(56,189,248,0.15)]">
        <div class="gauge-tick-ring"></div>
        <span class="text-xs font-bold text-slate-400 tracking-widest mt-2">SPEED</span>
        <span id="val-speed" class="text-5xl font-black mono text-white my-1">0</span>
        <span class="text-xs font-bold text-sky-400">KM/H</span>
      </div>

      <div class="col-span-2 gauge-card aspect-square">
        <div class="gauge-tick-ring"></div>
        <span class="text-[10px] font-bold text-slate-400 tracking-wider">BATTERY</span>
        <span id="val-bat" class="text-2xl font-extrabold mono text-emerald-400 my-0.5">0%</span>
        <span id="val-voltage" class="text-[10px] text-slate-400">0.0 V</span>
      </div>
    </div>

    <!-- BOTTOM ROW (TEMP ESC | CONSUMP | TEMP MOTOR) -->
    <div class="grid grid-cols-3 gap-2">
      <div class="gauge-card aspect-square">
        <div class="gauge-tick-ring"></div>
        <span class="text-[9px] font-bold text-slate-400 tracking-wider">TEMP ESC</span>
        <span id="val-tesc" class="text-base font-extrabold mono text-white">0</span>
        <span class="text-[9px] text-slate-500">°C</span>
      </div>

      <div class="gauge-card aspect-square">
        <div class="gauge-tick-ring"></div>
        <span class="text-[8px] font-bold text-slate-400 tracking-wider">CONSUMP.</span>
        <span id="val-cons" class="text-base font-extrabold mono text-white">0.0</span>
        <span class="text-[8px] text-slate-500">WH/KM</span>
      </div>

      <div class="gauge-card aspect-square">
        <div class="gauge-tick-ring"></div>
        <span class="text-[9px] font-bold text-slate-400 tracking-wider">TEMP MOTOR</span>
        <span id="val-tmot" class="text-base font-extrabold mono text-white">0</span>
        <span class="text-[9px] text-slate-500">°C</span>
      </div>
    </div>

  </main>

  <!-- FOOTER -->
  <footer class="bg-[#151a21] p-3 rounded-xl border border-[#263140] grid grid-cols-3 text-center">
    <div>
      <div class="text-[9px] font-bold text-slate-500 uppercase">Odometer</div>
      <div id="val-odo" class="text-sm font-bold mono text-slate-200">0.0 km</div>
    </div>
    <div>
      <div class="text-[9px] font-bold text-slate-500 uppercase">Trip</div>
      <div id="val-trip" class="text-sm font-bold mono text-sky-400">0.0 km</div>
    </div>
    <div>
      <div class="text-[9px] font-bold text-slate-500 uppercase">Up-Time</div>
      <div id="val-uptime" class="text-sm font-bold mono text-slate-200">00:00:00</div>
    </div>
  </footer>

<script>
  let bluetoothDevice, gattServer, rxCharacteristic, txCharacteristic;
  let isConnected = false;
  let demoInterval = null;
  let startTime = Date.now();

  const elSpeed = document.getElementById('val-speed');
  const elPower = document.getElementById('val-power');
  const elCurrent = document.getElementById('val-current');
  const elDuty = document.getElementById('val-duty');
  const elBat = document.getElementById('val-bat');
  const elVoltage = document.getElementById('val-voltage');
  const elTEsc = document.getElementById('val-tesc');
  const elTMot = document.getElementById('val-tmot');
  const elCons = document.getElementById('val-cons');
  const elTrip = document.getElementById('val-trip');
  const elOdo = document.getElementById('val-odo');
  const elUptime = document.getElementById('val-uptime');
  const statusDot = document.getElementById('status-dot');
  const statusText = document.getElementById('status-text');

  // Uptime Counter
  setInterval(() => {
    if(!isConnected && !demoInterval) return;
    let sec = Math.floor((Date.now() - startTime) / 1000);
    let hrs = Math.floor(sec / 3600).toString().padStart(2, '0');
    let min = Math.floor((sec % 3600) / 60).toString().padStart(2, '0');
    let s = (sec % 60).toString().padStart(2, '0');
    elUptime.textContent = `${hrs}:${min}:${s}`;
  }, 1000);

  function updateDashboard(data) {
    elSpeed.textContent = Math.round(data.speed);
    elPower.textContent = Math.round(data.power);
    elCurrent.textContent = (data.current).toFixed(1);
    elDuty.textContent = Math.round(data.duty);
    elBat.textContent = Math.round(data.battery) + '%';
    elVoltage.textContent = data.voltage.toFixed(1) + ' V';
    elTEsc.textContent = Math.round(data.tempEsc);
    elTMot.textContent = Math.round(data.tempMotor);
    elCons.textContent = data.cons.toFixed(1);
    elTrip.textContent = data.trip.toFixed(1) + ' km';
    if(data.odo) elOdo.textContent = data.odo.toFixed(1) + ' km';
  }

  // Demo Modus
  document.getElementById('btn-demo').onclick = () => {
    if (demoInterval) {
      clearInterval(demoInterval);
      demoInterval = null;
      statusDot.className = "w-3 h-3 rounded-full bg-red-500 shadow-[0_0_8px_#ef4444]";
      statusText.textContent = "OFFLINE";
      updateDashboard({speed:0, power:0, current:0, duty:0, battery:0, voltage:0, tempEsc:0, tempMotor:0, cons:0, trip:0, odo:0});
      return;
    }
    
    statusDot.className = "w-3 h-3 rounded-full bg-emerald-400 shadow-[0_0_8px_#34d399]";
    statusText.textContent = "DEMO MODE";
    let t = 0;
    demoInterval = setInterval(() => {
      t += 0.1;
      let spd = Math.abs(Math.sin(t) * 52);
      let pwr = spd * 22 + Math.random() * 40;
      let cur = pwr / 51.8;
      updateDashboard({
        speed: spd,
        power: pwr,
        current: cur,
        duty: (spd / 60) * 100,
        battery: 88,
        voltage: 51.8,
        tempEsc: 36 + (spd * 0.25),
        tempMotor: 41 + (spd * 0.35),
        cons: 15.4,
        trip: (t * 0.05),
        odo: 142.5
      });
    }, 100);
  };

  // Ninebot Bluetooth-Protokoll & Abfrage
  document.getElementById('btn-connect').onclick = async () => {
    if (!navigator.bluetooth) {
      alert("Nutze die 'Bluefy' App auf iOS oder Chrome, um Bluetooth zu aktivieren!");
      return;
    }

    try {
      statusText.textContent = "SEARCHING G3...";
      bluetoothDevice = await navigator.bluetooth.requestDevice({
        filters: [{ namePrefix: 'NB' }, { namePrefix: 'Ninebot' }, { namePrefix: 'SEGWAY' }],
        optionalServices: ['6e400001-b5a3-f393-e0a9-e50e24dca9e6']
      });

      statusText.textContent = "CONNECTING...";
      gattServer = await bluetoothDevice.gatt.connect();
      const service = await gattServer.getPrimaryService('6e400001-b5a3-f393-e0a9-e50e24dca9e6');
      
      txCharacteristic = await service.getCharacteristic('6e400002-b5a3-f393-e0a9-e50e24dca9e6');
      rxCharacteristic = await service.getCharacteristic('6e400003-b5a3-f393-e0a9-e50e24dca9e6');

      await rxCharacteristic.startNotifications();
      rxCharacteristic.addEventListener('characteristicvaluechanged', handleNinebotData);

      isConnected = true;
      statusDot.className = "w-3 h-3 rounded-full bg-sky-400 shadow-[0_0_8px_#38bdf8]";
      statusText.textContent = bluetoothDevice.name || "NINEBOT G3";

      // Periodische Datenabfrage (Ninebot Telemetrie Frame)
      setInterval(requestNinebotTelemetry, 200);

    } catch (error) {
      console.error(error);
      statusDot.className = "w-3 h-3 rounded-full bg-red-500 shadow-[0_0_8px_#ef4444]";
      statusText.textContent = "FAILED";
    }
  };

  // Telemetrie-Paket an Ninebot senden (ESC Abfrage)
  async function requestNinebotTelemetry() {
    if (!isConnected || !txCharacteristic) return;
    // Standard Ninebot Read Command für Speed, Akku, Temp, Current
    const cmd = new Uint8Array([0x55, 0xAA, 0x03, 0x20, 0x01, 0x25, 0x0E, 0xA9, 0xFF]);
    try {
      await txCharacteristic.writeValue(cmd);
    } catch(e) {}
  }

  // Eingehende Ninebot-Daten parsen und auf VESC-Werte umrechnen
  function handleNinebotData(event) {
    const value = event.target.value;
    if (value.byteLength < 14) return;

    // Byte-Parsing für Ninebot Datenpaket
    let speedRaw = (value.getUint16(4, true)) / 1000; // km/h
    let currentRaw = (value.getInt16(6, true)) / 100; // Ampere
    let voltageRaw = (value.getUint16(8, true)) / 100; // Volt
    let batteryRaw = value.getUint8(10); // %
    let tempEscRaw = value.getInt8(11); // °C

    let powerCalc = Math.abs(currentRaw * voltageRaw);
    let dutyCalc = Math.min(100, (speedRaw / 60) * 100); // Errechneter Duty Cycle basierend auf Topspeed

    updateDashboard({
      speed: speedRaw,
      power: powerCalc,
      current: currentRaw,
      duty: dutyCalc,
      battery: batteryRaw,
      voltage: voltageRaw,
      tempEsc: tempEscRaw,
      tempMotor: tempEscRaw + 4, // Geschätzte Motor-Temp bei Ninebot
      cons: speedRaw > 0 ? (powerCalc / speedRaw) : 0,
      trip: 0
    });
  }
</script>
</body>
</html>
